<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Distâncias</title>
    <style>
        table {
            border-collapse: collapse;
            margin: 20px auto;
        }
        td {
            width: 30px;
            height: 30px;
            text-align: center;
            border: 1px solid black;
            cursor: pointer;
        }
        .close {
            background-color: red;
        }
        .medium {
            background-color: yellow;
        }
        .far {
            background-color: green;
        }
        .center {
            text-align: center;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center;">Jogo de Distâncias</h1>
    <div class="center">
        <button onclick="resetGame()">Reiniciar Jogo</button>
    </div>
    <table id="matrix"></table>
    <p id="score" style="text-align: center;">Tentativas: 0</p>
    <p id="message" style="text-align: center;"></p>

    <script>
        const matrixSize = 10;
        let hiddenPoint;
        let clickCount = 0;
        let gameEnded = false;

        function initGame() {
            hiddenPoint = {
                x: Math.floor(Math.random() * matrixSize),
                y: Math.floor(Math.random() * matrixSize)
            };
            clickCount = 0;
            gameEnded = false;
            document.getElementById('score').textContent = 'Tentativas: 0';
            document.getElementById('message').textContent = '';
            createMatrix();
        }

        function createMatrix() {
            const table = document.getElementById('matrix');
            table.innerHTML = ''; // Clear previous table
            for (let i = 0; i < matrixSize; i++) {
                const row = document.createElement('tr');
                for (let j = 0; j < matrixSize; j++) {
                    const cell = document.createElement('td');
                    cell.addEventListener('click', () => handleCellClick(i, j, cell));
                    row.appendChild(cell);
                }
                table.appendChild(row);
            }
        }

        function handleCellClick(x, y, cell) {
            if (gameEnded) return;

            clickCount++;
            document.getElementById('score').textContent = `Tentativas: ${clickCount}`;
            const distance = calculateDistance(x, y, hiddenPoint.x, hiddenPoint.y);
            cell.textContent = distance;
            cell.className = getDistanceClass(distance);

            if (distance == 0) {
                gameEnded = true;
                document.getElementById('message').textContent = 'Parabéns! Você encontrou o ponto escondido!';
            }
        }

        function calculateDistance(x1, y1, x2, y2) {
            return Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2)).toFixed(2);
        }

        function getDistanceClass(distance) {
            if (distance == 0) return 'close';
            if (distance <= 3) return 'medium';
            return 'far';
        }

        function resetGame() {
            initGame();
        }

        initGame();
    </script>
</body>
</html>
