<!--
    index-matrix-distance.html

    Este ficheiro HTML é utilizado para calcular e exibir a distância entre elementos numa matriz.
    O propósito principal é fornecer uma interface visual para a entrada de dados da matriz e 
    exibir os resultados das distâncias calculadas entre os elementos selecionados.
    Inclui scripts JavaScript para manipulação da matriz e cálculos de distância, bem como 
    estilos CSS para apresentação visual.
-->
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Distâncias</title>
    <style>
        table {
            border-collapse: collapse;
            margin: 20px auto;
        }
        td {
            width: 30px;
            height: 30px;
            text-align: center;
            border: 1px solid black;
            cursor: pointer;
        }
        .close {
            background-color: red;
        }
        .medium {
            background-color: yellow;
        }
        .far {
            background-color: lightblue;
        }
        .center {
            text-align: center;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center;">Jogo de Distâncias</h1>
    <div class="center">
        <button onclick="resetGame()">Reiniciar Jogo</button>
    </div>
    <table id="matrix"></table>
    <p id="score" style="text-align: center;">Tentativas: 0</p>
    <p id="message" style="text-align: center;"></p>

    <script>
        const matrixSize = 10;
        let hiddenPoint;
        let clickCount = 0;
        let gameEnded = false;

        /**
         * Função: initGame
         * Descrição: Inicializa o jogo, definindo um ponto escondido aleatório na matriz, 
         *            reiniciando a contagem de cliques e o estado do jogo, e criando a matriz.
         * Parâmetros: Nenhum
         * Retorno: Nenhum
         */
        function initGame() {
            hiddenPoint = {
                x: Math.floor(Math.random() * matrixSize),
                y: Math.floor(Math.random() * matrixSize)
            };
            clickCount = 0;
            gameEnded = false;
            document.getElementById('score').textContent = 'Tentativas: 0';
            document.getElementById('message').textContent = '';
            createMatrix();
        }

        /**
         * Função: createMatrix
         * Descrição: Cria uma matriz de células clicáveis e a insere na tabela HTML. Cada célula 
         *            possui um evento de clique que chama a função handleCellClick.
         * Parâmetros: Nenhum
         * Retorno: Nenhum
         */
        function createMatrix() {
            const table = document.getElementById('matrix');
            table.innerHTML = ''; // Clear previous table
            for (let i = 0; i < matrixSize; i++) {
                const row = document.createElement('tr');
                for (let j = 0; j < matrixSize; j++) {
                    const cell = document.createElement('td');
                    cell.addEventListener('click', () => handleCellClick(i, j, cell));
                    row.appendChild(cell);
                }
                table.appendChild(row);
            }
        }

        /**
         * Função: handleCellClick
         * Descrição: Manipula o evento de clique em uma célula da matriz. Calcula a distância 
         *            entre a célula clicada e o ponto escondido, atualiza a contagem de cliques 
         *            e exibe a distância na célula. Se a distância for zero, o jogo termina.
         * Parâmetros:
         *   - x (number): Coordenada x da célula clicada.
         *   - y (number): Coordenada y da célula clicada.
         *   - cell (HTMLElement): Elemento da célula clicada.
         * Retorno: Nenhum
         */
        function handleCellClick(x, y, cell) {
            if (gameEnded) return;

            clickCount++;
            document.getElementById('score').textContent = `Tentativas: ${clickCount}`;
            const distance = calculateDistance(x, y, hiddenPoint.x, hiddenPoint.y);
            cell.textContent = distance;
            cell.className = getDistanceClass(distance);

            if (distance == 0) {
                gameEnded = true;
                document.getElementById('message').textContent = 'Parabéns! Você encontrou o ponto escondido!';
            }
        }

        /**
         * Função: calculateDistance
         * Descrição: Calcula a distância euclidiana entre dois pontos (x1, y1) e (x2, y2).
         * Parâmetros:
         *   - x1 (number): Coordenada x do primeiro ponto.
         *   - y1 (number): Coordenada y do primeiro ponto.
         *   - x2 (number): Coordenada x do segundo ponto.
         *   - y2 (number): Coordenada y do segundo ponto.
         * Retorno: A distância euclidiana entre os dois pontos.
         */
        function calculateDistance(x1, y1, x2, y2) {
            return Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2)).toFixed(2);
        }

        /**
         * Função: getDistanceClass
         * Descrição: Retorna a classe CSS correspondente a uma determinada distância.
         * Parâmetros:
         *   - distance (number): Distância a ser classificada.
         * Retorno: A classe CSS correspondente à distância.
         */
        function getDistanceClass(distance) {
            if (distance == 0) return 'close';
            if (distance <= 3) return 'medium';
            return 'far';
        }


        /**
         * Função: resetGame
         * Descrição: Reinicia o jogo, chamando a função initGame.
         * Parâmetros: Nenhum
         * Retorno: Nenhum
         */
        function resetGame() {
            initGame();
        }

        initGame();
    </script>
</body>
</html>
